<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>App de Mozo - Restaurante</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-primary: #222222;
      --color-secondary: #6b7280;
      --color-accent: #ef4444;
      --bg-light: #ffffff;
      --card-bg: #fafafa;
      --border-radius: 0.75rem;
      --shadow-light: rgba(0,0,0,0.05);
      --font-family: 'Poppins', sans-serif;
    }
    /* Reset and base */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: var(--font-family);
      background: var(--bg-light);
      color: var(--color-secondary);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a {
      color: var(--color-accent);
      text-decoration: none;
      transition: color 0.3s ease;
    }
    a:hover, a:focus {
      color: #b91c1c;
      outline: none;
    }
    header {
      background: var(--bg-light);
      box-shadow: 0 2px 4px var(--shadow-light);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .container {
      width: min(90%, 1200px);
      margin: 0 auto;
      padding: 0 1rem;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 64px;
    }
    .logo {
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--color-primary);
      user-select: none;
    }
    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
      margin: 0;
      padding: 0;
    }
    nav li {
      font-weight: 600;
      font-size: 1rem;
      color: var(--color-secondary);
    }
    nav li:hover, nav li:focus-within {
      color: var(--color-accent);
      cursor: pointer;
    }
    main {
      flex: 1;
      padding-bottom: 4rem;
    }
    /* Mesas */
    .tables-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin: 2rem auto 0;
      max-width: 800px;
    }
    .table-button {
      background: var(--card-bg);
      border: none;
      border-radius: var(--border-radius);
      padding: 1rem;
      text-align: center;
      cursor: pointer;
      transition: background-color 0.3s ease;
      position: relative;
      font-weight: 700;
      font-size: 1.25rem;
      color: white;
      user-select: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 110px;
      box-shadow: 0 3px 8px var(--shadow-light);
    }
    .table-button .status {
      font-size: 0.85rem;
      margin-top: 0.5rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .table-button.available {
      background-color: #10b981; /* Verde */
    }
    .table-button.occupied {
      background-color: #ef4444; /* Rojo */
    }
    .table-button.paying {
      background-color: #3b82f6; /* Azul */
    }
    .table-button:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }
    /* Order Section */
    .order-section {
      max-width: 750px;
      background: var(--card-bg);
      margin: 2rem auto 4rem;
      border-radius: var(--border-radius);
      box-shadow: 0 6px 20px var(--shadow-light);
      padding: 2rem 2.5rem;
      color: var(--color-primary);
      position: relative;
      display: none;
    }
    .order-section.active {
      display: block;
    }
    .order-section h2 {
      font-weight: 700;
      font-size: 2rem;
      margin-bottom: 1rem;
      text-align: center;
      user-select: none;
    }
    form {
      display: grid;
      gap: 1rem;
      font-size: 1rem;
      margin-bottom: 2rem;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.3rem;
      color: var(--color-primary);
      user-select: none;
    }
    select, input[type="text"], input[type="number"], textarea {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border-radius: var(--border-radius);
      border: 1.5px solid #d1d5db;
      font-family: var(--font-family);
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }
    select:focus, input[type="text"]:focus, input[type="number"]:focus, textarea:focus {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: 0 0 5px var(--color-accent);
    }
    textarea {
      resize: vertical;
      min-height: 60px;
    }
    button[type="button"], button[type="submit"] {
      background-color: var(--color-accent);
      color: var(--bg-light);
      border: none;
      border-radius: var(--border-radius);
      padding: 0.75rem;
      font-weight: 600;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
      user-select: none;
    }
    button[type="button"]:hover,
    button[type="button"]:focus,
    button[type="submit"]:hover,
    button[type="submit"]:focus {
      background-color: #b91c1c;
      outline: none;
      transform: scale(1.05);
    }
    /* Table interface */
    .table-interface {
      margin-top: 1rem;
    }
    .table-info {
      margin-bottom: 1rem;
      font-weight: 600;
      user-select: none;
    }
    table.order-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1rem;
    }
    table.order-table th,
    table.order-table td {
      border: 1px solid #d1d5db;
      padding: 0.5rem;
      text-align: left;
    }
    table.order-table th {
      background: var(--color-accent);
      color: white;
      user-select: none;
    }
    .search-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      position: relative;
    }
    .search-icon {
      cursor: pointer;
      font-size: 1.25rem;
      user-select: none;
      padding: 0.2rem 0.5rem;
    }
    .dish-list {
      display: none;
      position: absolute;
      top: 2.3rem;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #d1d5db;
      border-radius: var(--border-radius);
      box-shadow: 0 4px 14px var(--shadow-light);
      max-height: 200px;
      overflow-y: auto;
      z-index: 20;
      user-select: none;
      font-size: 0.9rem;
    }
    .dish-list div {
      padding: 0.5rem 1rem;
      cursor: pointer;
    }
    .dish-list div:hover,
    .dish-list div:focus {
      background: #f3f4f6;
      outline: none;
    }
    /* Modal styles */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0,0,0,0.3);
      display: none;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .modal {
      background: var(--bg-light);
      border-radius: var(--border-radius);
      max-width: 400px;
      padding: 1.5rem;
      box-shadow: 0 8px 28px rgba(239, 68, 68, 0.3);
      color: var(--color-primary);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      user-select: none;
    }
    .modal h3 {
      margin: 0;
      font-weight: 700;
      font-size: 1.5rem;
      user-select: none;
    }
    .modal label {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .modal select {
      width: 100%;
      margin-bottom: 1rem;
    }
    .modal button {
      align-self: flex-end;
      width: 100%;
      margin-top: 0.5rem;
    }
    /* Confirmation message */
    #confirmation-message {
      background: #d1fae5;
      border: 1px solid #10b981;
      color: #065f46;
      padding: 0.75rem 1rem;
      border-radius: var(--border-radius);
      margin-bottom: 1rem;
      display: none;
      font-weight: 600;
      user-select: none;
    }
    
    /* Responsive */
    @media (max-width: 640px) {
      .tables-container {
        grid-template-columns: repeat(2, 1fr);
      }
      .order-section {
        margin: 1.5rem 1rem 3rem;
        padding: 1rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <nav aria-label="Primary Navigation">
        <div class="logo" tabindex="0">Mozo App</div>
        <ul>
          <li tabindex="0">Mesas</li>
          <li tabindex="0">Perfil</li>
        </ul>
      </nav>
    </div>
  </header>
  <main>
    <div class="container">
      <div class="tables-container" id="tables-container" aria-label="Lista de mesas">
        <!-- Mesas se generarán aquí -->
      </div>
    </div>

    <section class="order-section" aria-label="Formulario de orden" id="order-section" tabindex="0" aria-live="polite">
      <h2 id="order-title">Interfaz de Mesa</h2>

      <div id="confirmation-message" role="alert" aria-live="polite"></div>

      <div class="table-interface" id="table-interface" aria-live="polite" aria-atomic="true">
        <div class="table-info" id="table-info" aria-live="polite" aria-atomic="true"></div>
        <table class="order-table" aria-label="Lista de pedidos">
          <thead>
            <tr>
              <th scope="col">Cantidad</th>
              <th scope="col">Descripción</th>
              <th scope="col">Precio</th>
              <th scope="col">Acciones</th>
            </tr>
          </thead>
          <tbody id="order-list"></tbody>
        </table>

        <form id="add-dish-form" aria-label="Agregar plato a la orden" novalidate autocomplete="off">
          <div class="search-container">
            <input type="text" id="dish-search" placeholder="Buscar plato..." aria-label="Buscar plato" autocomplete="off" />
            <span class="search-icon" id="btn-search-dish" role="button" tabindex="0" aria-label="Buscar platos">🔍</span>
            <div class="dish-list" id="dish-list" role="listbox" aria-live="polite"></div>
          </div>

          <label for="dish-name">Nombre del Plato</label>
          <input type="text" id="dish-name" readonly aria-readonly="true" placeholder="Seleccione un plato" />

          <label for="dish-price">Precio</label>
          <input type="text" id="dish-price" readonly aria-readonly="true" placeholder="Precio" />

          <label for="dish-description">Descripción</label>
          <textarea id="dish-description" rows="3" placeholder="Agregar descripción personalizada"></textarea>

          <label for="dish-quantity">Cantidad</label>
          <input type="number" id="dish-quantity" min="1" value="1" required aria-required="true" />

          <button type="submit" class="btn-primary">Agregar a la Orden</button>
        </form>

        <button type="button" id="btn-send-sale" class="btn-primary" style="margin-top: 1rem;" disabled>Enviar Pedido</button>
      </div>
    </section>
  </main>

  <!-- Modal Backdrop -->
  <div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal" role="document" tabindex="0" id="modal-content">
      <!-- Content will be injected via JS -->
    </div>
  </div>

  <footer>
    &copy; 2024 Mozo App - Restaurante
  </footer>

  <script>
    (() => {
      const tablesContainer = document.getElementById('tables-container');
      const orderSection = document.getElementById('order-section');
      const tableInfo = document.getElementById('table-info');
      const orderList = document.getElementById('order-list');
      const dishSearch = document.getElementById('dish-search');
      const btnSearchDish = document.getElementById('btn-search-dish');
      const dishList = document.getElementById('dish-list');
      const dishName = document.getElementById('dish-name');
      const dishPrice = document.getElementById('dish-price');
      const dishDescription = document.getElementById('dish-description');
      const dishQuantity = document.getElementById('dish-quantity');
      const addDishForm = document.getElementById('add-dish-form');
      const btnSendSale = document.getElementById('btn-send-sale');
      const confirmationMessage = document.getElementById('confirmation-message');
      const tableInterface = document.getElementById('table-interface');

      const modalBackdrop = document.getElementById('modal-backdrop');
      const modalContent = document.getElementById('modal-content');

      let currentSaleItems = [];
      let selectedTable = null;
      let customerName = "Cliente Ejemplo";
      let waiterName = "Mozo Ejemplo";

      // Estado mesas almacenado localmente para demo: número y estado
      const tables = [
        { number: 1, status: 'available' },
        { number: 2, status: 'available' },
        { number: 3, status: 'occupied' },
        { number: 4, status: 'paying' },
        { number: 5, status: 'available' },
        { number: 6, status: 'occupied' },
        { number: 7, status: 'available' },
        { number: 8, status: 'paying' }
      ];

      // Platos ejemplo
      const dishes = [
        { name: "Ensalada César", price: 10, description: "Ensalada fresca con aderezo César." },
        { name: "Pizza Margarita", price: 12, description: "Pizza clásica con tomate y mozzarella." },
        { name: "Pasta Alfredo", price: 15, description: "Pasta con salsa Alfredo cremosa." },
        { name: "Pollo a la Parrilla", price: 18, description: "Pollo marinado y asado a la perfección." },
        { name: "Postre de Chocolate", price: 6, description: "Delicioso postre de chocolate." }
      ];

      // Función para crear botones de mesa
      function renderTables() {
        tablesContainer.innerHTML = '';
        tables.forEach(table => {
          const btn = document.createElement('button');
          btn.className = 'table-button ' + table.status;
          btn.innerHTML = `Mesa ${table.number}<span class="status">${capitalize(table.status)}</span>`;
          btn.setAttribute('aria-pressed', 'false');
          btn.setAttribute('aria-label', `Mesa ${table.number}, estado ${table.status}`);
          btn.addEventListener('click', () => {
            selectTable(table.number);
          });
          tablesContainer.appendChild(btn);
        });
      }

      // Capitaliza cadena
      function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
      }

      // Selecciona mesa y muestra interfaz
      function selectTable(number) {
        selectedTable = number;
        // Actualizar estado mesa a occupied si estaba available (simulación sencilla)
        const tableObj = tables.find(t => t.number === number);
        if (tableObj.status === 'available') tableObj.status = 'occupied';
        updateTablesDisplay();

        // Mostrar interfaz mesa con datos
        const date = new Date().toLocaleDateString();
        const mesaStr = 'Mesa ' + number;
        tableInfo.textContent = `Mesa: ${mesaStr} | Cliente: ${customerName} | Fecha: ${date} | Mozo: ${waiterName}`;
        orderSection.classList.add('active');

        // Limpiar pedidos previos para mesa nueva
        currentSaleItems = [];
        orderList.innerHTML = '';
        confirmationMessage.style.display = 'none';
        btnSendSale.disabled = true;

        // Llevar foco a la búsqueda de plato para facilitar flujo
        dishSearch.value = '';
        dishName.value = '';
        dishPrice.value = '';
        dishDescription.value = '';
        dishQuantity.value = 1;
        dishSearch.focus();
      }

      // Actualiza colores y textos de las mesas (por posible cambio de estado)
      function updateTablesDisplay() {
        const buttons = tablesContainer.querySelectorAll('.table-button');
        buttons.forEach(btn => {
          const numText = btn.textContent.match(/Mesa (\d+)/);
          if (!numText) return;
          const num = parseInt(numText[1], 10);
          const tableObj = tables.find(t => t.number === num);
          btn.classList.remove('available', 'occupied', 'paying');
          btn.classList.add(tableObj.status);
          // Actualizar aria-label y texto estado
          btn.setAttribute('aria-label', `Mesa ${num}, estado ${tableObj.status}`);
          const spanStatus = btn.querySelector('.status');
          if(spanStatus) spanStatus.textContent = capitalize(tableObj.status);
        });
      }

      // Buscar y mostrar platos filtrados
      function refreshDishList(term) {
        dishList.innerHTML = '';
        if (!term.trim()) {
          dishList.style.display = 'none';
          return;
        }
        const filtered = dishes.filter(d => d.name.toLowerCase().includes(term.toLowerCase()));
        filtered.forEach(dish => {
          const div = document.createElement('div');
          div.tabIndex = 0;
          div.setAttribute('role', 'option');
          div.textContent = dish.name + " - $" + dish.price.toFixed(2);
          div.addEventListener('click', () => {
            selectDish(dish);
            dishList.style.display = 'none';
          });
          div.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              selectDish(dish);
              dishList.style.display = 'none';
            }
          });
          dishList.appendChild(div);
        });
        dishList.style.display = filtered.length ? 'block' : 'none';
      }

      dishSearch.addEventListener('input', () => {
        refreshDishList(dishSearch.value);
      });

      btnSearchDish.addEventListener('click', () => {
        refreshDishList(dishSearch.value);
      });

      // Seleccionar un plato para detalle
      function selectDish(dish) {
        dishName.value = dish.name;
        dishPrice.value = dish.price.toFixed(2);
        dishDescription.value = dish.description || '';
        dishQuantity.value = 1;
        dishQuantity.focus();
      }

      // Añadir plato a la orden
      addDishForm.addEventListener('submit', e => {
        e.preventDefault();

        if (!selectedTable) {
          alert('Seleccione una mesa primero.');
          return;
        }
        if (!dishName.value || !dishPrice.value) {
          alert('Seleccione un plato válido.');
          return;
        }
        const qty = parseInt(dishQuantity.value, 10);
        if (isNaN(qty) || qty < 1) {
          alert('Ingrese una cantidad válida.');
          return;
        }
        const item = {
          name: dishName.value,
          price: parseFloat(dishPrice.value),
          description: dishDescription.value || '',
          quantity: qty
        };
        currentSaleItems.push(item);
        appendOrderItemRow(item);
        dishName.value = '';
        dishPrice.value = '';
        dishDescription.value = '';
        dishQuantity.value = 1;
        dishSearch.value = '';
        dishList.style.display = 'none';
        btnSendSale.disabled = false;
        confirmationMessage.style.display = 'none';
      });

      // Añadir fila a la tabla de pedidos
      function appendOrderItemRow(item) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.quantity}</td>
          <td><strong>${item.name}</strong>${item.description ? `<br/><small style="color:#6b7280;">${item.description}</small>` : ''}</td>
          <td>$${(item.price * item.quantity).toFixed(2)}</td>
          <td><button type="button" aria-label="Eliminar ${item.name}" data-name="${item.name}" class="btn-remove-item" style="background:#ef4444; border:none; color:white; padding:0.2rem 0.6rem; border-radius:0.4rem; cursor:pointer;">×</button></td>
        `;
        orderList.appendChild(tr);
      }

      // Eliminar item de la orden
      orderList.addEventListener('click', e => {
        if (e.target.classList.contains('btn-remove-item')) {
          const name = e.target.getAttribute('data-name');
          currentSaleItems = currentSaleItems.filter(i => i.name !== name);
          e.target.closest('tr').remove();
          btnSendSale.disabled = currentSaleItems.length === 0;
        }
      });

      // Enviar pedido a "base de datos" simulada y mostrar confirmación y opciones de pago
      btnSendSale.addEventListener('click', () => {
        if (!selectedTable) {
          alert('Seleccione una mesa primero.');
          return;
        }
        if (currentSaleItems.length === 0) {
          alert('No hay pedidos para enviar.');
          return;
        }
        btnSendSale.disabled = true;
        confirmationMessage.style.display = 'none';

        fetch('https://jsonplaceholder.typicode.com/posts', {
          method: 'POST',
          body: JSON.stringify({
            mesa: 'Mesa ' + selectedTable,
            cliente: customerName,
            mozo: waiterName,
            items: currentSaleItems,
            fecha: new Date().toISOString()
          }),
          headers: {
            'Content-type': 'application/json; charset=UTF-8',
          },
        })
        .then(response => {
          if (!response.ok) {
            throw new Error('Error al enviar pedido.');
          }
          return response.json();
        })
        .then(data => {
          confirmationMessage.textContent = '¡Pedido enviado correctamente!';
          confirmationMessage.style.display = 'block';
          openPaymentModal();
        })
        .catch(() => {
          alert('Error enviando pedido. Intente nuevamente.');
          btnSendSale.disabled = false;
        });
      });

      // Modal apertura y cierre
      function openModal(content) {
        modalContent.innerHTML = content;
        modalBackdrop.style.display = 'flex';
        modalBackdrop.setAttribute('aria-hidden', 'false');
        const focusable = modalContent.querySelector('select, button, [tabindex]:not([tabindex="-1"])');
        if (focusable) focusable.focus();
      }

      function closeModal() {
        modalBackdrop.style.display = 'none';
        modalBackdrop.setAttribute('aria-hidden', 'true');
      }

      modalBackdrop.addEventListener('click', e => {
        if (e.target === modalBackdrop) closeModal();
      });

      // Modal método de pago
      function openPaymentModal() {
        const html = `
          <h3>Seleccione Método de Pago</h3>
          <label for="payment-method">Método de Pago:</label>
          <select id="payment-method" aria-label="Método de pago">
            <option value="" disabled selected>Seleccione método</option>
            <option value="Efectivo">Efectivo</option>
            <option value="Billetera Virtual">Billetera Virtual</option>
            <option value="Tarjeta">Tarjeta</option>
          </select>
          <button id="btn-next-invoice" disabled>Continuar</button>
          <button id="btn-cancel-payment" style="background:#6b7280; margin-top:0.5rem;">Cancelar</button>
        `;
        openModal(html);

        const selectPayment = document.getElementById('payment-method');
        const btnNext = document.getElementById('btn-next-invoice');
        const btnCancel = document.getElementById('btn-cancel-payment');

        selectPayment.addEventListener('change', () => {
          btnNext.disabled = selectPayment.value === '';
        });

        btnNext.addEventListener('click', () => {
          const method = selectPayment.value;
          closeModal();
          openInvoiceModal(method);
          setTableStatus(selectedTable, 'paying');
          updateTablesDisplay();
        });

        btnCancel.addEventListener('click', () => {
          closeModal();
          btnSendSale.disabled = false;
        });
      }

      // Modal tipo comprobante
      function openInvoiceModal(paymentMethod) {
        const html = `
          <h3>Seleccione Tipo de Comprobante</h3>
          <label for="invoice-type">Tipo:</label>
          <select id="invoice-type" aria-label="Tipo de comprobante">
            <option value="" disabled selected>Seleccione comprobante</option>
            <option value="Boleta">Boleta</option>
            <option value="Factura">Factura</option>
          </select>
          <button id="btn-confirm-payment" disabled>Confirmar</button>
          <button id="btn-cancel-invoice" style="background:#6b7280; margin-top:0.5rem;">Cancelar</button>
        `;
        openModal(html);

        const selectInvoice = document.getElementById('invoice-type');
        const btnConfirm = document.getElementById('btn-confirm-payment');
        const btnCancel = document.getElementById('btn-cancel-invoice');

        selectInvoice.addEventListener('change', () => {
          btnConfirm.disabled = selectInvoice.value === '';
        });

        btnConfirm.addEventListener('click', () => {
          closeModal();
          alert(`Pago confirmado con ${paymentMethod} y comprobante ${selectInvoice.value}. Gracias.`);
          // Cambiar estado mesa a disponible tras pago
          setTableStatus(selectedTable, 'available');
          updateTablesDisplay();
          resetOrderForm();
        });

        btnCancel.addEventListener('click', () => {
          closeModal();
          btnSendSale.disabled = false;
        });
      }

      // Cambia estado mesa en tables array
      function setTableStatus(tableNumber, status) {
        const table = tables.find(t => t.number === tableNumber);
        if (table) {
          table.status = status;
        }
      }

      // Resetea formulario y estado
      function resetOrderForm() {
        currentSaleItems = [];
        orderList.innerHTML = '';
        btnSendSale.disabled = true;
        confirmationMessage.style.display = 'none';
        selectedTable = null;
        tableInfo.textContent = '';
        dishName.value = '';
        dishPrice.value = '';
        dishDescription.value = '';
        dishQuantity.value = 1;
        dishSearch.value = '';
        dishList.style.display = 'none';
        orderSection.classList.remove('active');
      }

      // Inicializar
      renderTables();

    })();
  </script>
</body>
</html>
